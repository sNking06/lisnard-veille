name: veille

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 h
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/raw/x/**", "analyzer/**", "schema/**", "web/**", "collectors/**"]

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collect-analyze-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Dépendances Python
        run: pip install -r collectors/requirements.txt

      # NB : la collecte X n'est PAS faite ici. Elle est poussée dans data/raw/x/ par Grok Bot (voir docs/collecte_x.md).
      - name: Collecte TikTok + YouTube + site (idempotente, mode dégradé si yt-dlp bloqué)
        continue-on-error: true
        env:
          PYTHON: python
        run: bash scripts/collect_all.sh 5

      - name: Analyse des nouveautés (nécessite le secret ANALYZER_API_KEY)
        env:
          ANALYZER_API_KEY: ${{ secrets.ANALYZER_API_KEY }}
          ANALYZER_API_URL: ${{ vars.ANALYZER_API_URL }}
          ANALYZER_MODEL: ${{ vars.ANALYZER_MODEL }}
        run: python analyzer/run.py analyze --limit 5

      - name: Validation des analyses
        run: python analyzer/run.py validate

      - name: Commit des nouvelles données
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: collecte et analyses automatiques" && git push)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build du site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site-statique
          path: web/out
